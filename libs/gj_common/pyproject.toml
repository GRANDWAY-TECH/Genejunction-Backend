[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gj-common"
version = "0.1.0"
description = "Shared platform library for GeneJunction marketplace services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "aiokafka>=0.11",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "structlog>=24.4",
  "prometheus-fastapi-instrumentator>=7.0",
  "tenacity>=9.0",
  "boto3>=1.35",
]

[tool.setuptools.packages.find]
include = ["gj_common*"]

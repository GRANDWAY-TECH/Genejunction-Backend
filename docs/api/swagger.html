<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeneJunction API Console</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
</head>
<body>
  <div id="ui"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    // Calls go to the same gateway that serves this page. Authorize with an access token from /auth/login.
    SwaggerUIBundle({
      url: "openapi.json",
      dom_id: "#ui",
      deepLinking: true,
      persistAuthorization: true,
      displayRequestDuration: true,
      docExpansion: "none",
      filter: true,
      tryItOutEnabled: true,
      requestInterceptor: (req) => { req.headers["X-Request-ID"] = crypto.randomUUID().replaceAll("-", ""); return req; },
    });
  </script>
</body>
</html>

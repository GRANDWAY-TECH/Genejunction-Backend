# Local stand-in for CloudFront + WAF + API Gateway: one public entry point that routes
# /api/v1/<resource> to the owning service. /internal/* is never exposed.

worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  resolver 127.0.0.11 valid=10s ipv6=off;
  client_max_body_size 10m;
  proxy_read_timeout 30s;
  log_format json escape=json '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri",'
                              '"status":$status,"upstream":"$upstream_addr","rt":$request_time,"rid":"$request_id"}';
  access_log /dev/stdout json;

  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:20m rate=50r/s;

  map $uri $upstream_service {
    ~^/\.well-known/                 identity;
    ~^/api/v1/(auth|users)(/|$)      identity;
    ~^/api/v1/tenants(/|$)           tenant;
    ~^/api/v1/partners(/|$)          partner;
    ~^/api/v1/catalog(/|$)           catalog;
    ~^/api/v1/(cart|orders|prescriptions|partner-orders|admin/orders)(/|$) order;
    ~^/api/v1/payments(/|$)          payment;
    ~^/api/v1/billing(/|$)           billing;
    ~^/api/v1/pharmacy(/|$)          pharmacy;
    ~^/api/v1/lab(/|$)               lab;
    ~^/api/v1/wholesale(/|$)         wholesale;
    ~^/api/v1/notifications(/|$)     notification;
    ~^/api/v1/(consult|folio|legacy)(/|$) legacy-bridge;
    default                          "";
  }

  server {
    listen 8080;

    location /internal/ { return 404; }

    # API reference (built by scripts/build_api_docs.py)
    location = /docs { return 301 /docs/; }
    location /docs/ {
      alias /usr/share/nginx/docs/;
      index index.html;
      add_header Cache-Control "no-cache";
    }

    location = /health { return 200 '{"status":"ok"}'; add_header Content-Type application/json; }

    location /api/v1/auth/otp/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      set $identity identity;
      proxy_pass http://$identity:8000;
    }

    location / {
      if ($upstream_service = "") { return 404 '{"error":{"code":"not_found","message":"No such route"}}'; }
      limit_req zone=api burst=100 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_pass http://$upstream_service:8000;
    }
  }
}
